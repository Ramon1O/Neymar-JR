<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de HTML, CSS e JS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Formulário de HTML, CSS e JS</h1>

    <h2>Perguntas e Respostas</h2>


    <form id="formulario">

        <!-- Nome -->

        <div class="nome">

            <label for="nome">
                Digite seu nome:
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

        </div>


        <!-- Tabela -->

        <table>

            <thead>

                <tr>

                    <th>Pergunta</th>

                    <th>Opções de Resposta</th>

                </tr>

            </thead>


            <tbody>


                <!-- PERGUNTA 1 -->

                <tr>

                    <td class="pergunta">
                        1. Qual é a principal diferença entre HTML e CSS?
                    </td>

                    <td>

                        <label>
                            <input type="radio" name="q1" value="a">
                            HTML e CSS são a mesma coisa.
                        </label>

                        <label>
                            <input type="radio" name="q1" value="b">
                            HTML cria a estrutura e CSS cuida do visual.
                        </label>

                        <label>
                            <input type="radio" name="q1" value="c">
                            CSS cria o conteúdo da página.
                        </label>

                        <label>
                            <input type="radio" name="q1" value="d">
                            CSS é usado para texto.
                        </label>

                    </td>

                </tr>


                <!-- PERGUNTA 2 -->

                <tr>

                    <td class="pergunta">
                        2. O que é uma linguagem de programação?
                    </td>

                    <td>

                        <label>
                            <input type="radio" name="q2" value="a">
                            Um idioma falado por pessoas.
                        </label>

                        <label>
                            <input type="radio" name="q2" value="b">
                            Uma forma de escrever instruções para o computador.
                        </label>

                        <label>
                            <input type="radio" name="q2" value="c">
                            Um tipo de arquivo de música.
                        </label>

                        <label>
                            <input type="radio" name="q2" value="d">
                            Um programa para editar fotos.
                        </label>

                    </td>

                </tr>


                <!-- PERGUNTA 3 -->

                <tr>

                    <td class="pergunta">
                        3. O que é JavaScript?
                    </td>

                    <td>

                        <label>
                            <input type="radio" name="q3" value="a">
                            JavaScript é uma linguagem de programação usada para adicionar interatividade às páginas da web.
                        </label>

                        <label>
                            <input type="radio" name="q3" value="b">
                            É usado para criar páginas da internet.
                        </label>

                        <label>
                            <input type="radio" name="q3" value="c">
                            Serve para organizar arquivos no computador.
                        </label>

                        <label>
                            <input type="radio" name="q3" value="d">
                            É uma ferramenta para desenhar imagens.
                        </label>

                    </td>

                </tr>


                <!-- PERGUNTA 4 -->

                <tr>

                    <td class="pergunta">
                        4. O que é CSS?
                    </td>

                    <td>

                        <label>
                            <input type="radio" name="q4" value="a">
                            CSS é uma linguagem de estilo usada para definir a aparência de elementos HTML.
                        </label>

                        <label>
                            <input type="radio" name="q4" value="b">
                            Controla o computador.
                        </label>

                        <label>
                            <input type="radio" name="q4" value="c">
                            Edita vídeos.
                        </label>

                        <label>
                            <input type="radio" name="q4" value="d">
                            CSS é um programa usado para criar e editar arquivos de texto.
                        </label>

                    </td>

                </tr>


                <!-- PERGUNTA 5 -->

                <tr>

                    <td class="pergunta">
                        5. O que é HTML?
                    </td>

                    <td>

                        <label>
                            <input type="radio" name="q5" value="a">
                            É um banco de dados.
                        </label>

                        <label>
                            <input type="radio" name="q5" value="b">
                            É uma linguagem relacionada ao JavaScript.
                        </label>

                        <label>
                            <input type="radio" name="q5" value="c">
                            HTML é uma linguagem de marcação usada para criar páginas da web.
                        </label>

                        <label>
                            <input type="radio" name="q5" value="d">
                            É um sistema operacional.
                        </label>

                    </td>

                </tr>


            </tbody>

        </table>


        <button type="submit">
            Enviar Respostas
        </button>


    </form>


    <script src="script.js"></script>

</body>

</html>
